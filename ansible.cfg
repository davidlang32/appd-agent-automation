[defaults]
inventory          = inventory/hosts.yml
roles_path         = roles
# Bundled (offline) collections install here first; see packaging/.
collections_path   = collections:~/.ansible/collections
host_key_checking  = False
retry_files_enabled = False
stdout_callback    = yaml
gathering          = smart
forks              = 25
interpreter_python = auto_silent
# Accountability: a rolling log every run; report.yml archives a copy into the
# timestamped run folder. Run with --diff to capture line-level config changes.
log_path           = artifacts/ansible-latest.log
callbacks_enabled  = ansible.posix.profile_tasks
# Vault for controller access keys / secrets:
# vault_password_file = .vault_pass   (do NOT commit this file)

[privilege_escalation]
# Linux hosts that need root to write under /opt/appdynamics set become at play level.
become      = False
become_method = sudo

[ssh_connection]
pipelining = True
