---
# =============================================================================
# Inventory
# =============================================================================
# Two independent axes of grouping:
#
#   1. OS groups (linux / windows)  -> decide HOW we connect (ssh vs psrp/winrm)
#      and supply OS-specific paths. Connection method must be known before we
#      connect, so a host's OS lives here.
#
#   2. Agent-type groups (java_agents, dotnet_agents, machine_agents,
#      db_agents) -> decide WHICH role/config a host receives.
#
# A host belongs to ONE OS group and ONE OR MORE agent-type groups.
# The roles themselves are OS-agnostic: they branch on gathered facts
# (ansible_system / os_family), so the same playbook run handles a mixed
# Linux+Windows server list in a single pass. See README "OS handling".
# =============================================================================

all:
  children:

    # ---- Axis 1: OS / connection ----------------------------------------
    linux:
      vars:
        ansible_connection: ssh
        ansible_user: "{{ appd_ssh_user | default('appdsvc') }}"
        appd_home: /opt/appdynamics
      hosts:
        # app01.example.com:
        # db01.example.com:

    windows:
      vars:
        ansible_connection: psrp          # or winrm; or ssh if OpenSSH is installed
        ansible_user: "{{ appd_win_user | default('appdsvc') }}"
        ansible_psrp_protocol: https
        ansible_port: 5986
        appd_home: 'C:\opt\appdynamics'
      hosts:
        # web01.example.com:
        # win-db01.example.com:

    # ---- Axis 2: agent type ---------------------------------------------
    java_agents:
      hosts:
        # app01.example.com:

    dotnet_agents:
      hosts:
        # web01.example.com:

    machine_agents:
      hosts:
        # app01.example.com:
        # web01.example.com:

    db_agents:
      hosts:
        # db01.example.com:
        # win-db01.example.com:
