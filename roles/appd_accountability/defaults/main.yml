---
# Computed run identifiers (start.yml sets the real values on localhost).
acct_run_id: "{{ ansible_date_time.iso8601_basic_short | default('manual') }}"
acct_run_dir: "{{ acct_artifacts_base }}/{{ acct_run_id }}"
acct_results_file: "{{ acct_run_dir }}/results.jsonl"
acct_report_file: "{{ acct_run_dir }}/report.html"
acct_metadata_file: "{{ acct_run_dir }}/run_metadata.json"
