---
# Uninstall: archive the config (scrubbed, with manifest — the ONLY thing left
# behind), then fully delete the install, service registration, and startup
# files so security never finds a stale agent.

- name: Archive config before removal
  ansible.builtin.include_role:
    name: appd_common
    tasks_from: backup_config
  vars:
    bc_agent_home: "{{ machine_agent_home }}"
    bc_version: "{{ machine_agent_current_version | default('unknown') }}"
    bc_preserve: "{{ machine_agent_preserve_files }}"
    bc_custom_dirs: "{{ machine_agent_custom_dirs }}"
    bc_stock_names: "{{ machine_agent_stock_extensions }}"
    bc_service_name: "{{ machine_agent_service_name }}"
    bc_backup_dir: "{{ machine_agent_backup_dir }}"

- name: Stop the service
  ansible.builtin.include_role:
    name: appd_common
    tasks_from: manage_service
  vars:
    appd_service_name: "{{ machine_agent_service_name }}"
    appd_service_state: stopped
  ignore_errors: true

# ---------------------------------------------------------------- Linux -----
- name: Uninstall (Linux)
  become: true
  when: not appd_is_windows
  block:
    - name: Disable the service
      ansible.builtin.systemd:
        name: "{{ machine_agent_service_name }}"
        enabled: false
      failed_when: false

    - name: Kill any lingering agent process
      ansible.builtin.command: pkill -f machineagent.jar
      register: _ma_pkill
      failed_when: false
      changed_when: _ma_pkill.rc == 0

    - name: Remove systemd unit
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ machine_agent_service_name }}.service"
        state: absent

    - name: Remove startup params
      ansible.builtin.file:
        path: "/etc/sysconfig/{{ machine_agent_service_name }}"
        state: absent

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Delete the install directory
      ansible.builtin.file:
        path: "{{ machine_agent_home }}"
        state: absent

    - name: Verify the agent is gone
      ansible.builtin.stat:
        path: "{{ machine_agent_home }}"
      register: _ma_rm_lin

    - name: Assert removal
      ansible.builtin.assert:
        that: not _ma_rm_lin.stat.exists
        fail_msg: "{{ machine_agent_home }} still present after removal"

# -------------------------------------------------------------- Windows -----
- name: Uninstall (Windows)
  when: appd_is_windows
  block:
    - name: Kill any lingering agent JVM
      ansible.windows.win_shell: |
        Get-CimInstance Win32_Process -Filter "Name='java.exe'" |
          Where-Object { $_.CommandLine -like '*machineagent.jar*' } |
          ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
      failed_when: false
      changed_when: false

    - name: Unregister the service (bundle uninstaller)
      ansible.windows.win_shell: cscript.exe //nologo UninstallService.vbs
      args:
        chdir: "{{ machine_agent_home }}"
      failed_when: false
      changed_when: true

    - name: Ensure the service registration is gone
      ansible.windows.win_service:
        name: "{{ machine_agent_service_name }}"
        state: absent
      failed_when: false

    - name: Delete the install directory
      ansible.windows.win_file:
        path: "{{ machine_agent_home }}"
        state: absent

    - name: Verify the agent is gone
      ansible.windows.win_stat:
        path: "{{ machine_agent_home }}"
      register: _ma_rm_win

    - name: Assert removal
      ansible.builtin.assert:
        that: not _ma_rm_win.stat.exists
        fail_msg: "{{ machine_agent_home }} still present after removal"

- name: Record uninstall result
  ansible.builtin.set_fact:
    machine_agent_result: "REMOVED {{ machine_agent_current_version | default('unknown') }} — config archived at {{ bc_archive_path | default('n/a') }}"
