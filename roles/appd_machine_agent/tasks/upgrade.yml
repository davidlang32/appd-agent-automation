---
# Upgrade: archive -> stop -> move old aside (rollback point) -> deploy new ->
# re-render config -> carry over non-rendered preserved files/custom monitors
# -> start -> quick verify. Deep controller-reporting check is deferred to
# playbooks/validate.yml (agents take minutes to register).
#
# Rendered-from-vars config (controller-info.xml, extension YAMLs) is recreated
# by configure.yml, so it survives by definition. Only NON-rendered artifacts
# (cacerts.jks, log4j.xml, custom monitors/extensions, startup params) are
# carried from the old install.

- name: Archive full config before touching anything
  ansible.builtin.include_role:
    name: appd_common
    tasks_from: backup_config
  vars:
    bc_agent_home: "{{ machine_agent_home }}"
    bc_version: "{{ machine_agent_current_version | default('unknown') }}"
    bc_preserve: "{{ machine_agent_preserve_files }}"
    bc_custom_dirs: "{{ machine_agent_custom_dirs }}"
    bc_stock_names: "{{ machine_agent_stock_extensions }}"
    bc_service_name: "{{ machine_agent_service_name }}"
    bc_backup_dir: "{{ machine_agent_backup_dir }}"

- name: Stop the service
  ansible.builtin.include_role:
    name: appd_common
    tasks_from: manage_service
  vars:
    appd_service_name: "{{ machine_agent_service_name }}"
    appd_service_state: stopped
  ignore_errors: true

# ---------------------------------------------------------------- Linux -----
- name: Upgrade (Linux)
  become: true
  when: not appd_is_windows
  block:
    - name: Move old install aside (rollback point)
      ansible.builtin.command: mv "{{ machine_agent_home }}" "{{ machine_agent_home }}.old-{{ ansible_date_time.iso8601_basic_short }}"
      changed_when: true
      register: _ma_move

    - name: Remember rollback path
      ansible.builtin.set_fact:
        machine_agent_old_dir: "{{ machine_agent_home }}.old-{{ ansible_date_time.iso8601_basic_short }}"

    - name: Create new agent home
      ansible.builtin.file:
        path: "{{ machine_agent_home }}"
        state: directory
        mode: "0755"

    - name: Extract the new bundle
      ansible.builtin.unarchive:
        src: "{{ machine_agent_bundle_dir }}/{{ machine_agent_bundle_zip }}"
        dest: "{{ machine_agent_home }}"

    - name: Carry over non-rendered preserved files
      ansible.builtin.shell: |
        cd "{{ machine_agent_old_dir }}"
        cp --parents -r "{{ item }}" "{{ machine_agent_home }}/" 2>/dev/null || true
      loop: "{{ machine_agent_preserve_files }}"
      changed_when: true

    - name: Carry over custom monitors/extensions not shipped in the bundle
      ansible.builtin.shell: |
        for base in {{ machine_agent_custom_dirs | join(' ') }}; do
          old="{{ machine_agent_old_dir }}/$base"; new="{{ machine_agent_home }}/$base"
          [ -d "$old" ] || continue
          for d in "$old"/*/; do
            [ -d "$d" ] || continue; name=$(basename "$d")
            case " {{ machine_agent_stock_extensions | join(' ') }} " in
              *" $name "*) ;;
              *) [ -d "$new/$name" ] || cp -r "$d" "$new/$name" ;;
            esac
          done
        done
      failed_when: false
      changed_when: true

    - name: Keep existing startup params (create default only if missing)
      ansible.builtin.template:
        src: machine-agent-sysconfig.j2
        dest: "/etc/sysconfig/{{ machine_agent_service_name }}"
        force: false
        mode: "0640"

    - name: Ensure systemd unit exists (leave an existing one untouched)
      ansible.builtin.template:
        src: appdynamics-machine-agent.service.j2
        dest: "/etc/systemd/system/{{ machine_agent_service_name }}.service"
        force: false
        mode: "0644"

    - name: Write version marker
      ansible.builtin.copy:
        content: "{{ machine_agent_version }}\n"
        dest: "{{ machine_agent_marker_file }}"
        mode: "0644"

# -------------------------------------------------------------- Windows -----
- name: Upgrade (Windows)
  when: appd_is_windows
  block:
    - name: Move old install aside (rollback point)
      ansible.windows.win_shell: >-
        Move-Item -Path '{{ machine_agent_home }}'
        -Destination '{{ machine_agent_home }}.old-{{ ansible_date_time.iso8601_basic_short }}'
      changed_when: true

    - name: Remember rollback path
      ansible.builtin.set_fact:
        machine_agent_old_dir: "{{ machine_agent_home }}.old-{{ ansible_date_time.iso8601_basic_short }}"

    - name: Copy new bundle to host
      ansible.windows.win_copy:
        src: "{{ machine_agent_bundle_dir }}/{{ machine_agent_bundle_zip }}"
        dest: "C:\\Windows\\Temp\\{{ machine_agent_bundle_zip }}"

    - name: Extract the new bundle
      ansible.windows.win_shell: >-
        Expand-Archive -Path 'C:\Windows\Temp\{{ machine_agent_bundle_zip }}'
        -DestinationPath '{{ machine_agent_home }}' -Force

    - name: Remove copied bundle
      ansible.windows.win_file:
        path: "C:\\Windows\\Temp\\{{ machine_agent_bundle_zip }}"
        state: absent

    - name: Carry over preserved files + custom monitors from the old install
      ansible.windows.win_shell: |
        $old = '{{ machine_agent_old_dir }}'; $new = '{{ machine_agent_home }}'
        $preserve = '{{ machine_agent_preserve_files | to_json }}' | ConvertFrom-Json
        foreach ($rel in $preserve) {
          $rel = $rel.Replace([char]47,[char]92); $s = Join-Path $old $rel
          if (Test-Path $s) { $d = Join-Path $new $rel; New-Item -ItemType Directory -Force -Path (Split-Path $d) | Out-Null; Copy-Item $s $d -Recurse -Force }
        }
        $stock = '{{ machine_agent_stock_extensions | to_json }}' | ConvertFrom-Json
        foreach ($base in ('{{ machine_agent_custom_dirs | to_json }}' | ConvertFrom-Json)) {
          $od = Join-Path $old $base
          if (Test-Path $od) { Get-ChildItem $od -Directory | Where-Object { $stock -notcontains $_.Name } | ForEach-Object {
            $d = Join-Path $new ($base + [char]92 + $_.Name); if (-not (Test-Path $d)) { Copy-Item $_.FullName $d -Recurse } } }
        }

    - name: Write version marker
      ansible.windows.win_copy:
        content: "{{ machine_agent_version }}"
        dest: "{{ machine_agent_marker_file }}"

# --------------------------------------------------------------- config -----
- name: Re-render config (controller-info + extensions)
  ansible.builtin.include_tasks: configure.yml

- name: Fix ownership (Linux)
  ansible.builtin.file:
    path: "{{ machine_agent_home }}"
    state: directory
    owner: "{{ appd_owner }}"
    group: "{{ appd_group }}"
    recurse: true
  become: true
  when: not appd_is_windows

- name: Start the service
  ansible.builtin.include_role:
    name: appd_common
    tasks_from: manage_service
  vars:
    appd_service_name: "{{ machine_agent_service_name }}"
    appd_service_state: started

# --------------------------------------------------- quick verify + rollback -
- name: Quick post-upgrade verify (service + startup log)
  block:
    - name: Confirm service active (Linux)
      ansible.builtin.command: systemctl is-active {{ machine_agent_service_name }}
      register: _ma_v_lin
      changed_when: false
      retries: 3
      delay: 10
      until: _ma_v_lin.stdout | trim == 'active'
      become: true
      when: not appd_is_windows

    - name: Confirm service running (Windows)
      ansible.windows.win_shell: (Get-Service -Name '{{ machine_agent_service_name }}').Status
      register: _ma_v_win
      changed_when: false
      retries: 3
      delay: 10
      until: _ma_v_win.stdout is search('Running')
      when: appd_is_windows

    - name: Startup line in the agent log (Linux)
      ansible.builtin.shell: grep -E "{{ machine_agent_log_success_patterns | join('|') }}" "{{ machine_agent_home }}/logs/machine-agent.log"
      register: _ma_log_lin
      changed_when: false
      retries: 6
      delay: 10
      until: _ma_log_lin.rc == 0
      become: true
      when: not appd_is_windows

    - name: Startup line in the agent log (Windows)
      ansible.windows.win_shell: |
        $p = '{{ machine_agent_log_success_patterns | to_json }}' | ConvertFrom-Json
        Select-String -Path '{{ machine_agent_home }}\logs\machine-agent.log' -Pattern $p -Quiet
      register: _ma_log_win
      changed_when: false
      retries: 6
      delay: 10
      until: _ma_log_win.stdout is search('True')
      when: appd_is_windows

    - name: Remove the rollback copy (upgrade verified locally)
      ansible.builtin.file:
        path: "{{ machine_agent_old_dir }}"
        state: absent
      become: "{{ not appd_is_windows }}"
      when: machine_agent_old_dir is defined

    - name: Record upgrade result
      ansible.builtin.set_fact:
        machine_agent_result: "UPGRADED {{ machine_agent_current_version | default('unknown') }} -> {{ machine_agent_version }} (controller reporting checked in validate.yml)"

  rescue:
    - name: Roll back (Linux)
      become: true
      when: not appd_is_windows and machine_agent_old_dir is defined
      block:
        - name: Stop the failed new agent
          ansible.builtin.service:
            name: "{{ machine_agent_service_name }}"
            state: stopped
          failed_when: false
        - name: Delete the failed new install
          ansible.builtin.file:
            path: "{{ machine_agent_home }}"
            state: absent
        - name: Restore the old install
          ansible.builtin.command: mv "{{ machine_agent_old_dir }}" "{{ machine_agent_home }}"
          changed_when: true
        - name: Start the old agent
          ansible.builtin.service:
            name: "{{ machine_agent_service_name }}"
            state: started

    - name: Roll back (Windows)
      when: appd_is_windows and machine_agent_old_dir is defined
      block:
        - name: Stop the failed new agent
          ansible.windows.win_service:
            name: "{{ machine_agent_service_name }}"
            state: stopped
          failed_when: false
        - name: Delete the failed new install
          ansible.windows.win_file:
            path: "{{ machine_agent_home }}"
            state: absent
        - name: Restore the old install
          ansible.windows.win_shell: Move-Item -Path '{{ machine_agent_old_dir }}' -Destination '{{ machine_agent_home }}'
          changed_when: true
        - name: Start the old agent
          ansible.windows.win_service:
            name: "{{ machine_agent_service_name }}"
            state: started

    - name: Record rollback
      ansible.builtin.set_fact:
        machine_agent_go: false
        machine_agent_skip_reason: "post-upgrade verify FAILED — ROLLED BACK to {{ machine_agent_current_version | default('previous version') }}"
        machine_agent_result: "UPGRADE FAILED — rolled back to {{ machine_agent_current_version | default('previous') }}"
